services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hisaab
      POSTGRES_PASSWORD: hisaab_dev_password
      POSTGRES_DB: hisaab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisaab"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hisaab:hisaab_dev_password@postgres:5432/hisaab
      ENVIRONMENT: dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
