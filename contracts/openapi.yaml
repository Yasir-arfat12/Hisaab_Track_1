                      status: "needs_review"
                      due_date: "2026-11-30"
                      created_at: "2026-11-20T11:00:00Z"
                    - promise_id: "11111111-0008-0000-0000-000000000008"
                      merchant_name: "Swiggy"
                      merchant_id: "aaaaaaaa-0008-0000-0000-000000000008"
                      category: "other"
                      amount_paise: 50000
                      status: "dismissed"
                      due_date: "2026-11-20"
