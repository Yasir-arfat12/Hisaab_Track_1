        "200":
          description: Updated promise summary
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: "#/components/schemas/PromiseSummary"
                  error:
                    type: "null"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: PROMISE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ════════════════════════════════════════════
  # CREDITS
  # ════════════════════════════════════════════

  /credits/upload:
    post:
      operationId: uploadCredits
      tags: [Credits]
      summary: Upload bank credit CSV
      description: Accepts multipart CSV upload of bank credits. Enqueues matching job.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, bank_name]
              properties:
                file:
                  type: string
                  format: binary
                  description: "CSV file (max 10 MB). Required columns: date, description, amount, reference_number"
                bank_name:
                  type: string
                  example: "HDFC"
                account_last4:
                  type: string
                  maxLength: 4
                  pattern: "^[0-9]{4}$"
                  example: "1234"
      responses:
        "200":
          description: Upload accepted, job queued
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: object
                    required: [job_id, rows_detected, status]
                    properties:
                      job_id:
                        type: string
                        format: uuid
                        example: "ccdd5678-9012-34ef-ab56-78901234cdef"
                      rows_detected:
                        type: integer
                        example: 42
                      status:
                        type: string
                        enum: [queued]
                        example: "queued"
                  error:
                    type: "null"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "422":
          description: CREDIT_UPLOAD_FAILED or VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                data: null
                error:
                  code: CREDIT_UPLOAD_FAILED
                  message: "CSV is missing required column: amount"
                  details:
                    missing_columns: ["amount"]

  /credits:
    get:
      operationId: listCredits
      tags: [Credits]
      summary: List bank credits
      description: Cursor-paginated list of uploaded bank credit records.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
        - name: matched
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by whether a promise was matched
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-11-01"
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-11-30"
      responses:
        "200":
          description: Paginated credit list
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    allOf:
                      - type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/BankCredit"
                      - $ref: "#/components/schemas/PaginationMeta"
                  error:
                    type: "null"
              example:
                data:
                  items:
                    - credit_id: "cccc0001-0000-0000-0000-000000000001"
                      date: "2026-11-14"
                      description: "FLIPKART REFUND REF FKT2026112201"
                      amount_paise: 249900
                      reference_number: "FKT2026112201"
                      matched_promise_id: "11111111-0001-0000-0000-000000000001"
                      bank_name: "HDFC"
                    - credit_id: "cccc0003-0000-0000-0000-000000000003"
                      date: "2026-11-11"
                      description: "AMAZON RETURNS REF AMZ89900"
                      amount_paise: 89900
                      reference_number: "AMZ89900"
                      matched_promise_id: "11111111-0003-0000-0000-000000000003"
                      bank_name: "HDFC"
                    - credit_id: "cccc0005-0000-0000-0000-000000000005"
                      date: "2026-11-21"
                      description: "IRCTC REFUND PARTIAL REF IRC3200"
                      amount_paise: 290000
                      reference_number: "IRC3200"
                      matched_promise_id: "11111111-0005-0000-0000-000000000005"
                      bank_name: "SBI"
                  next_cursor: null
                  prev_cursor: null
                  limit: 20
                error: null
        "401":
          $ref: "#/components/responses/AuthRequired"

  # ════════════════════════════════════════════
  # VERIFY
  # ════════════════════════════════════════════

  /verify/{promise_id}:
    post:
      operationId: verifyPromise
      tags: [Verify]
      summary: Re-verify promise against credits
      description: Deterministic code-only verification pass. No LLM involved.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: promise_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "11111111-0005-0000-0000-000000000005"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: "#/components/schemas/VerifyResult"
                  error:
                    type: "null"
              example:
                data:
                  promise_id: "11111111-0005-0000-0000-000000000005"
                  previous_status: "pending"
                  new_status: "needs_review"
                  matched_credit_id: "cccc0005-0000-0000-0000-000000000005"
                  amount_paise_expected: 320000
                  amount_paise_received: 290000
                  verified_at: "2026-11-26T07:10:00Z"
                error: null
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: PROMISE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ════════════════════════════════════════════
  # ESCALATION
  # ════════════════════════════════════════════

  /escalation/{promise_id}/next-step:
    get:
      operationId: escalationNextStep
      tags: [Escalation]
      summary: Get next escalation step
      description: Returns deterministic next rung and deadline math. No LLM.
      security:
        - cookieAuth: []
      parameters:
        - name: promise_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "11111111-0002-0000-0000-000000000002"
      responses:
        "200":
          description: Next escalation step
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: "#/components/schemas/EscalationNextStep"
                  error:
                    type: "null"
              example:
                data:
                  promise_id: "11111111-0002-0000-0000-000000000002"
                  current_rung: 2
                  next_rung: 3
                  rung_name: "Formal Written Complaint"
                  rung_description: "Send a formal complaint letter via registered post to HDFC Insurance grievance officer"
                  deadline_date: "2026-12-10"
                  days_until_deadline: 14
                  legal_forum: "Insurance Ombudsman"
                error: null
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: PROMISE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /escalation/{promise_id}/draft:
    post:
      operationId: escalationDraft
      tags: [Escalation]
      summary: Generate escalation draft
      description: LLM-generated draft message. Always includes a not-legal-advice notice.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: promise_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "11111111-0002-0000-0000-000000000002"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rung]
              properties:
                rung:
                  type: integer
                  minimum: 1
                  maximum: 4
                  example: 3
                tone:
                  type: string
                  enum: [firm, polite]
                  default: firm
                  example: "firm"
                include_legal_references:
                  type: boolean
                  default: false
                  example: true
      responses:
        "200":
          description: LLM-generated escalation draft
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: "#/components/schemas/EscalationDraft"
                  error:
                    type: "null"
              example:
                data:
                  draft_text: "Subject: Formal Complaint Regarding Pending Insurance Claim #CLM-2026-4521\n\nDear HDFC Insurance Grievance Officer,\n\nI am writing to formally escalate my claim..."
                  rung: 3
                  not_legal_advice_notice: "This draft is generated by AI for reference only. It does not constitute legal advice. Please consult a qualified legal professional for advice specific to your situation."
                  generated_at: "2026-11-26T07:15:00Z"
                  model_used: "gemini-2.0-flash"
                error: null
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: PROMISE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: LLM_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                data: null
                error:
                  code: LLM_UNAVAILABLE
                  message: "LLM service is temporarily unavailable"
                  details:
                    retry_after_seconds: 30

  # ════════════════════════════════════════════
  # DOSSIER
  # ════════════════════════════════════════════

  /dossier/{promise_id}/generate:
    post:
      operationId: dossierGenerate
      tags: [Dossier]
      summary: Enqueue dossier PDF generation
      description: Enqueues background PDF generation. Poll /jobs/{job_id} for status.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: promise_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "11111111-0002-0000-0000-000000000002"
      responses:
        "200":
          description: Dossier generation enqueued
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: object
                    required: [job_id, status, enqueued_at]
                    properties:
                      job_id:
                        type: string
                        format: uuid
                        example: "ddee9012-3456-78ab-cdef-901234567890"
                      status:
                        type: string
                        enum: [queued]
                        example: "queued"
                      enqueued_at:
                        type: string
                        format: date-time
                        example: "2026-11-26T07:20:00Z"
                  error:
                    type: "null"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: PROMISE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /dossier/{promise_id}/download:
    get:
      operationId: dossierDownload
      tags: [Dossier]
      summary: Download dossier PDF
      description: Streams the generated PDF. Job must be in completed status first.
      security:
        - cookieAuth: []
      parameters:
        - name: promise_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "11111111-0002-0000-0000-000000000002"
      responses:
        "200":
          description: PDF file stream
          headers:
            Content-Disposition:
              schema:
                type: string
              example: "attachment; filename=\"hisaab-dossier-11111111-0002-0000-0000-000000000002.pdf\""
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: PROMISE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: DOSSIER_GENERATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                data: null
                error:
                  code: DOSSIER_GENERATION_FAILED
                  message: "Dossier has not been generated yet. Please enqueue generation first."
                  details:
                    promise_id: "11111111-0002-0000-0000-000000000002"

