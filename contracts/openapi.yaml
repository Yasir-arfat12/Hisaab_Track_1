openapi: 3.1.0
info:
  title: Hisaab API
  version: "1.0.0"
  description: |
    API for Hisaab — a consumer promise-tracking and escalation assistant.

    **Base path**: `/api/v1`
    **Auth**: httpOnly session cookie (`session_id`)
    **Money**: all monetary values are integer paise (₹1 = 100 paise)
    **IDs**: UUID v4 strings
    **Pagination**: cursor-based (`next_cursor`, `prev_cursor`, `limit`)
    **Idempotency**: `Idempotency-Key` header on state-changing POSTs

servers:
  - url: /api/v1
    description: Hisaab API v1

# ─────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_id

  # ─────────────────────────────────────────────
  # Shared parameters
  # ─────────────────────────────────────────────
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated UUID to prevent duplicate state mutations.

    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque pagination cursor from a previous response.

    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size.

  # ─────────────────────────────────────────────
  # Reusable schemas
  # ─────────────────────────────────────────────
  schemas:

    # ── Envelope ──────────────────────────────
    SuccessEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          description: Response payload (shape varies per endpoint).
        error:
          type: "null"

    ErrorEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: "null"
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - VALIDATION_ERROR
            - NOT_FOUND
            - RATE_LIMITED
            - LLM_UNAVAILABLE
            - GMAIL_AUTH_EXPIRED
            - SYNC_IN_PROGRESS
            - PROMISE_NOT_FOUND
            - CREDIT_UPLOAD_FAILED
            - JOB_NOT_FOUND
            - DOSSIER_GENERATION_FAILED
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    # ── Pagination ────────────────────────────
    PaginationMeta:
      type: object
      required: [next_cursor, prev_cursor, limit]
      properties:
        next_cursor:
          type: [string, "null"]
          example: "eyJpZCI6IjExMTExMTExLTAwMDMifQ=="
        prev_cursor:
          type: [string, "null"]
          example: null
        limit:
          type: integer
          example: 20

    # ── User ──────────────────────────────────
    UserProfile:
      type: object
      required: [user_id, email, display_name, is_demo, gmail_connected, created_at]
      properties:
        user_id:
          type: string
          format: uuid
          example: "d4e8f012-3456-7890-abcd-ef0123456789"
        email:
          type: string
          format: email
          example: "rahul@example.com"
        display_name:
          type: string
          example: "Rahul Sharma"
        is_demo:
          type: boolean
          example: false
        gmail_connected:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-11-01T10:00:00Z"

    # ── Promise ───────────────────────────────
    PromiseStatus:
      type: string
      enum: [pending, kept, overdue, needs_review, dismissed]

    PromiseCategory:
      type: string
      enum: [refund, delivery_credit, insurance, ticket, other]

    PromiseSummary:
      type: object
      required: [promise_id, merchant_name, merchant_id, category, amount_paise, status, due_date, created_at]
      properties:
        promise_id:
          type: string
          format: uuid
          example: "11111111-0001-0000-0000-000000000001"
        merchant_name:
          type: string
          example: "Flipkart"
        merchant_id:
          type: string
          format: uuid
          example: "aaaaaaaa-0001-0000-0000-000000000001"
        category:
          $ref: "#/components/schemas/PromiseCategory"
        amount_paise:
          type: integer
          description: Promised amount in paise (1 INR = 100 paise)
          example: 249900
        status:
          $ref: "#/components/schemas/PromiseStatus"
        due_date:
          type: string
          format: date
          example: "2026-11-15"
        created_at:
          type: string
          format: date-time
          example: "2026-11-01T12:00:00Z"

    TimelineEvent:
      type: object
      required: [event_id, type, description, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          example: "evt-0001-0000-0000-0000-000000000001"
        type:
          type: string
          enum:
            - promise_extracted
            - credit_matched
            - overdue_detected
            - escalation_advanced
            - user_note_added
            - status_changed
            - verification_run
          example: "promise_extracted"
        description:
          type: string
          example: "Promise extracted from email"
        occurred_at:
          type: string
          format: date-time
          example: "2026-10-15T09:00:00Z"
        metadata:
          type: [object, "null"]
          additionalProperties: true

    PromiseDetail:
      allOf:
        - $ref: "#/components/schemas/PromiseSummary"
        - type: object
          required: [timeline, updated_at]
          properties:
            received_amount_paise:
              type: [integer, "null"]
              example: null
            source_email_id:
              type: [string, "null"]
              example: "msg_hdfc_001"
            source_email_subject:
              type: [string, "null"]
              example: "Your claim #CLM-2026-4521 has been approved"
            user_note:
              type: [string, "null"]
              example: "Called helpline on Nov 12, they said processing"
            escalation_rung:
              type: [integer, "null"]
              minimum: 1
              maximum: 4
              example: 2
            exact_quote:
              type: string
              example: "Your claim #CLM-2026-4521 of Rs. 15,000 has been approved and will be credited by Nov 10, 2026."
            confidence:
              type: number
              format: float
              minimum: 0.0
              maximum: 1.0
              example: 0.97
            extraction_method:
              type: string
              enum: [llm, deterministic]
              example: "llm"
            needs_review_reason:
              type: [string, "null"]
              example: null
            updated_at:
              type: string
              format: date-time
              example: "2026-11-20T14:30:00Z"
            timeline:
              type: array
              items:
                $ref: "#/components/schemas/TimelineEvent"

    # ── Job ───────────────────────────────────
    JobType:
      type: string
      enum: [gmail_sync, credit_upload, dossier_generation]

    JobStatus:
      type: string
      enum: [queued, running, completed, failed]

    Job:
      type: object
      required: [job_id, type, status, created_at]
      properties:
        job_id:
          type: string
          format: uuid
          example: "aabb1234-5678-90ab-cdef-012345678901"
        type:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        progress_pct:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          example: 100
        created_at:
          type: string
          format: date-time
          example: "2026-11-26T07:00:00Z"
        completed_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-26T07:04:30Z"
        result:
          type: [object, "null"]
          additionalProperties: true
        error_message:
          type: [string, "null"]
          example: null

    # ── Credit ────────────────────────────────
    BankCredit:
      type: object
      required: [credit_id, date, description, amount_paise, bank_name]
      properties:
        credit_id:
          type: string
          format: uuid
          example: "cccc0001-0000-0000-0000-000000000001"
        date:
          type: string
          format: date
          example: "2026-11-14"
        description:
          type: string
          example: "FLIPKART REFUND REF FKT2026112201"
        amount_paise:
          type: integer
          example: 249900
        reference_number:
          type: [string, "null"]
          example: "FKT2026112201"
        matched_promise_id:
          type: [string, "null"]
          format: uuid
          example: "11111111-0001-0000-0000-000000000001"
        bank_name:
          type: string
          example: "HDFC"

    # ── Escalation ────────────────────────────
    EscalationNextStep:
      type: object
      required: [promise_id, next_rung, rung_name, rung_description, deadline_date, days_until_deadline]
      properties:
        promise_id:
          type: string
          format: uuid
          example: "11111111-0002-0000-0000-000000000002"
        current_rung:
          type: [integer, "null"]
          example: 2
        next_rung:
          type: integer
          minimum: 1
          maximum: 4
          example: 3
        rung_name:
          type: string
          example: "Formal Written Complaint"
        rung_description:
          type: string
          example: "Send a formal complaint letter via registered post to HDFC Insurance grievance officer"
        deadline_date:
          type: string
          format: date
          example: "2026-12-10"
        days_until_deadline:
          type: integer
          example: 14
        legal_forum:
          type: [string, "null"]
          example: "Insurance Ombudsman"

    EscalationDraft:
      type: object
      required: [draft_text, rung, not_legal_advice_notice, generated_at, model_used]
      properties:
        draft_text:
          type: string
          example: "Subject: Formal Complaint Regarding Pending Insurance Claim #CLM-2026-4521\n\nDear HDFC Insurance Grievance Officer,\n\nI am writing to formally escalate my claim..."
        rung:
          type: integer
          example: 3
        not_legal_advice_notice:
          type: string
          example: "This draft is generated by AI for reference only. It does not constitute legal advice. Please consult a qualified legal professional for advice specific to your situation."
        generated_at:
          type: string
          format: date-time
          example: "2026-11-26T07:15:00Z"
        model_used:
          type: string
          example: "gemini-2.0-flash"

    # ── Dashboard ─────────────────────────────
    DashboardSummary:
      type: object
      required: [total_owed_paise, total_overdue_paise, total_kept_paise, counts, computed_at]
      properties:
        total_owed_paise:
          type: integer
          example: 2069900
        total_overdue_paise:
          type: integer
          example: 2150000
        total_kept_paise:
          type: integer
          example: 374800
        counts:
          type: object
          required: [total, pending, kept, overdue, needs_review, dismissed]
          properties:
            total:
              type: integer
              example: 8
            pending:
              type: integer
              example: 1
            kept:
              type: integer
              example: 2
            overdue:
              type: integer
              example: 2
            needs_review:
              type: integer
              example: 2
            dismissed:
              type: integer
              example: 1
        computed_at:
          type: string
          format: date-time
          example: "2026-11-26T07:00:00Z"

    # ── Merchant ──────────────────────────────
    MerchantRecord:
      type: object
      required: [merchant_id, merchant_name, total_promises, kept_count, overdue_count, dismissed_count, keep_rate_pct]
      properties:
        merchant_id:
          type: string
          format: uuid
          example: "aaaaaaaa-0001-0000-0000-000000000001"
        merchant_name:
          type: string
          example: "Flipkart"
        total_promises:
          type: integer
          example: 1
        kept_count:
          type: integer
          example: 1
        overdue_count:
          type: integer
          example: 0
        dismissed_count:
          type: integer
          example: 0
        average_resolution_days:
          type: [number, "null"]
          example: 13
        keep_rate_pct:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 100.0

    # ── Demo ──────────────────────────────────
    DemoScenario:
      type: string
      enum: [refund_arrives, refund_delayed, fake_promise, duplicate_charge]

    DemoSimulateResult:
      type: object
      required: [scenario, affected_promise_id, description, simulated_at]
      properties:
        scenario:
          $ref: "#/components/schemas/DemoScenario"
        affected_promise_id:
          type: string
          format: uuid
          example: "11111111-0004-0000-0000-000000000004"
        description:
          type: string
          example: "Zomato delivery credit of ₹149 marked as received; bank credit injected"
        simulated_at:
          type: string
          format: date-time
          example: "2026-11-26T07:30:00Z"

    # ── Health ────────────────────────────────
    HealthStatus:
      type: object
      required: [status, version, checks, uptime_seconds]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: "ok"
        version:
          type: string
          example: "1.0.0"
        checks:
          type: object
          required: [database, llm]
          properties:
            database:
              type: string
              enum: [ok, error]
              example: "ok"
            llm:
              type: string
              enum: [ok, degraded, error]
              example: "ok"
        uptime_seconds:
          type: integer
          example: 86400

    # ── Verify ────────────────────────────────
    VerifyResult:
      type: object
      required: [promise_id, previous_status, new_status, amount_paise_expected, verified_at]
      properties:
        promise_id:
          type: string
          format: uuid
          example: "11111111-0005-0000-0000-000000000005"
        previous_status:
          $ref: "#/components/schemas/PromiseStatus"
        new_status:
          $ref: "#/components/schemas/PromiseStatus"
        matched_credit_id:
          type: [string, "null"]
          format: uuid
          example: "cccc0005-0000-0000-0000-000000000005"
        amount_paise_expected:
          type: integer
          example: 320000
        amount_paise_received:
          type: [integer, "null"]
          example: 290000
        verified_at:
          type: string
          format: date-time
          example: "2026-11-26T07:10:00Z"

  # ─────────────────────────────────────────────
  # Reusable responses
  # ─────────────────────────────────────────────
  responses:
    AuthRequired:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            error:
              code: AUTH_REQUIRED
              message: "Session expired or not found"
              details: {}

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    RateLimited:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ════════════════════════════════════════════
  # AUTH
  # ════════════════════════════════════════════

  /auth/google/start:
    get:
      operationId: authGoogleStart
      tags: [Auth]
      summary: Start Google OAuth flow
      description: Returns the Google authorization URL for the client to redirect to.
      security: []
      responses:
        "200":
          description: Redirect URL returned
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: object
                    required: [redirect_url]
                    properties:
                      redirect_url:
                        type: string
                        format: uri
                        example: "https://accounts.google.com/o/oauth2/v2/auth?client_id=...&scope=email+profile&state=abc123"
                  error:
                    type: "null"

  /auth/google/callback:
    get:
      operationId: authGoogleCallback
      tags: [Auth]
      summary: Google OAuth callback
      description: Exchanges authorization code for tokens, sets session cookie.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: OAuth authorization code from Google
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: Anti-CSRF state token
      responses:
        "200":
          description: User profile after successful login
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "session_id=<token>; HttpOnly; Secure; SameSite=Lax"
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: "#/components/schemas/UserProfile"
                  error:
                    type: "null"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/demo:
    post:
      operationId: authDemo
      tags: [Auth]
      summary: Create demo session
      description: Creates or resets a seeded demo user and sets session cookie.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Demo session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: object
                    required: [user_id, email, display_name, is_demo, seed_scenario]
                    properties:
                      user_id:
                        type: string
                        format: uuid
                        example: "00000000-demo-0000-0000-000000000001"
                      email:
                        type: string
                        example: "demo@hisaab.app"
                      display_name:
                        type: string
                        example: "Demo User"
                      is_demo:
                        type: boolean
                        example: true
                      seed_scenario:
                        type: string
                        example: "v1_standard_8_promises"
                  error:
                    type: "null"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      operationId: authLogout
      tags: [Auth]
      summary: Logout
      description: Destroys session and clears session cookie.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: object
                    properties:
                      logged_out:
                        type: boolean
                        example: true
                  error:
                    type: "null"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /auth/me:
    get:
      operationId: authMe
      tags: [Auth]
      summary: Get current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: "#/components/schemas/UserProfile"
                  error:
                    type: "null"
              example:
                data:
                  user_id: "d4e8f012-3456-7890-abcd-ef0123456789"
                  email: "rahul@example.com"
                  display_name: "Rahul Sharma"
                  is_demo: false
                  gmail_connected: true
                  created_at: "2026-11-01T10:00:00Z"
                error: null
        "401":
          $ref: "#/components/responses/AuthRequired"
    delete:
      operationId: authDeleteMe
      tags: [Auth]
      summary: Delete current user account
      description: Revokes Gmail token, cascade deletes all user data, and clears session cookie.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted:
                        type: boolean
                        example: true
                  error:
                    type: "null"
              example:
                data:
                  deleted: true
                error: null
        "401":
          $ref: "#/components/responses/AuthRequired"

  # ════════════════════════════════════════════
  # GMAIL
  # ════════════════════════════════════════════

  /gmail/connect:
    post:
      operationId: gmailConnect
      tags: [Gmail]
      summary: Start Gmail OAuth flow
      description: Returns Gmail OAuth redirect URL for gmail.readonly scope.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Gmail OAuth redirect URL
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: object
                    required: [redirect_url]
                    properties:
                      redirect_url:
                        type: string
                        format: uri
                        example: "https://accounts.google.com/o/oauth2/v2/auth?scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fgmail.readonly&..."
                  error:
                    type: "null"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /gmail/disconnect:
    post:
      operationId: gmailDisconnect
      tags: [Gmail]
      summary: Disconnect Gmail
      description: Revokes Gmail token and purges raw email data. Keeps extracted promise data.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Gmail disconnected
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: object
                    required: [disconnected, emails_purged]
                    properties:
                      disconnected:
                        type: boolean
                        example: true
                      emails_purged:
                        type: integer
                        example: 1247
                  error:
                    type: "null"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /gmail/sync:
    post:
      operationId: gmailSync
      tags: [Gmail]
      summary: Enqueue Gmail sync
      description: Enqueues a background sync job. Returns 409 if sync is already running.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                full_resync:
                  type: boolean
                  default: false
                  description: Re-process all emails, not just new ones.
      responses:
        "200":
          description: Job enqueued
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: object
                    required: [job_id, status, enqueued_at]
                    properties:
                      job_id:
                        type: string
                        format: uuid
                        example: "aabb1234-5678-90ab-cdef-012345678901"
                      status:
                        type: string
                        enum: [queued, running]
                        example: "queued"
                      enqueued_at:
                        type: string
                        format: date-time
                        example: "2026-11-26T07:00:00Z"
                  error:
                    type: "null"
        "401":
          description: AUTH_REQUIRED or GMAIL_AUTH_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: SYNC_IN_PROGRESS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                data: null
                error:
                  code: SYNC_IN_PROGRESS
                  message: "A Gmail sync is already in progress"
                  details:
                    job_id: "aabb1234-5678-90ab-cdef-012345678901"

  /gmail/status:
    get:
      operationId: gmailStatus
      tags: [Gmail]
      summary: Get Gmail sync status
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Gmail status and sync info
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: object
                    required: [connected, last_synced_at, sync_status, emails_processed]
                    properties:
                      connected:
                        type: boolean
