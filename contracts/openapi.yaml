  # ════════════════════════════════════════════
  # JOBS
  # ════════════════════════════════════════════

  /jobs/{job_id}:
    get:
      operationId: getJob
      tags: [Jobs]
      summary: Get job status
      description: Polls status, progress, and result of any background job.
      security:
        - cookieAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "aabb1234-5678-90ab-cdef-012345678901"
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: "#/components/schemas/Job"
                  error:
                    type: "null"
              example:
                data:
                  job_id: "aabb1234-5678-90ab-cdef-012345678901"
                  type: "gmail_sync"
                  status: "completed"
                  progress_pct: 100
                  created_at: "2026-11-26T07:00:00Z"
                  completed_at: "2026-11-26T07:04:30Z"
                  result:
                    emails_scanned: 1247
                    promises_extracted: 3
                    promises_updated: 1
                  error_message: null
                error: null
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: JOB_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                data: null
                error:
                  code: JOB_NOT_FOUND
                  message: "No job found with the given ID"
                  details:
                    job_id: "aabb1234-0000-0000-0000-000000000000"

  # ════════════════════════════════════════════
  # PROMISES
  # ════════════════════════════════════════════

  /promises:
