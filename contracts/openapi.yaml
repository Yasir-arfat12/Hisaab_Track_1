                error: null
        "401":
          $ref: "#/components/responses/AuthRequired"
        "422":
          $ref: "#/components/responses/ValidationError"

  /promises/{promise_id}:
    get:
      operationId: getPromise
      tags: [Promises]
      summary: Get promise detail
      description: Full promise detail including timeline of events.
      security:
        - cookieAuth: []
      parameters:
        - name: promise_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "11111111-0002-0000-0000-000000000002"
      responses:
        "200":
          description: Promise detail with timeline
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: "#/components/schemas/PromiseDetail"
                  error:
                    type: "null"
              example:
                data:
                  promise_id: "11111111-0002-0000-0000-000000000002"
                  merchant_name: "HDFC Insurance"
                  merchant_id: "aaaaaaaa-0002-0000-0000-000000000002"
                  category: "insurance"
                  amount_paise: 1500000
                  received_amount_paise: null
                  status: "overdue"
                  due_date: "2026-11-10"
                  source_email_id: "msg_hdfc_001"
                  source_email_subject: "Your claim #CLM-2026-4521 has been approved"
                  user_note: "Called helpline on Nov 12, they said processing"
                  escalation_rung: 2
                  exact_quote: "Your claim #CLM-2026-4521 of Rs. 15,000 has been approved and will be credited by Nov 10, 2026."
                  confidence: 0.97
                  extraction_method: "llm"
                  needs_review_reason: null
                  created_at: "2026-10-15T09:00:00Z"
                  updated_at: "2026-11-20T14:30:00Z"
                  timeline:
                    - event_id: "evt-0001-0000-0000-0000-000000000001"
                      type: "promise_extracted"
                      description: "Promise extracted from email"
                      occurred_at: "2026-10-15T09:00:00Z"
                      metadata:
                        confidence_score: 0.97
                    - event_id: "evt-0001-0000-0000-0000-000000000002"
                      type: "overdue_detected"
                      description: "Due date passed without matching bank credit"
                      occurred_at: "2026-11-11T00:01:00Z"
                      metadata: null
                    - event_id: "evt-0001-0000-0000-0000-000000000003"
                      type: "escalation_advanced"
                      description: "Escalation advanced to rung 2"
                      occurred_at: "2026-11-15T08:00:00Z"
                      metadata:
                        rung: 2
                error: null
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: PROMISE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    patch:
      operationId: updatePromise
      tags: [Promises]
      summary: Update promise
      description: Update promise status (dismiss) or user note.
      security:
        - cookieAuth: []
      parameters:
        - name: promise_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "11111111-0008-0000-0000-000000000008"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
