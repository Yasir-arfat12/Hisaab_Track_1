                data:
                  total_owed_paise: 2069900
                  total_overdue_paise: 2150000
                  total_kept_paise: 374800
                  counts:
                    total: 8
                    pending: 1
                    kept: 2
                    overdue: 2
                    needs_review: 2
                    dismissed: 1
                  computed_at: "2026-11-26T07:00:00Z"
                error: null
        "401":
          $ref: "#/components/responses/AuthRequired"

  # ════════════════════════════════════════════
  # MERCHANT
  # ════════════════════════════════════════════

  /merchants/{merchant_id}/record:
    get:
      operationId: merchantRecord
      tags: [Merchant]
      summary: Get merchant promise-keeping record
      description: Statistics on a merchant's promise fulfillment history.
      security:
        - cookieAuth: []
      parameters:
        - name: merchant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "aaaaaaaa-0001-0000-0000-000000000001"
      responses:
        "200":
          description: Merchant record
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: "#/components/schemas/MerchantRecord"
                  error:
                    type: "null"
              example:
                data:
                  merchant_id: "aaaaaaaa-0001-0000-0000-000000000001"
                  merchant_name: "Flipkart"
                  total_promises: 1
                  kept_count: 1
                  overdue_count: 0
                  dismissed_count: 0
                  average_resolution_days: 13
                  keep_rate_pct: 100.0
                error: null
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  # ════════════════════════════════════════════
  # DEMO
  # ════════════════════════════════════════════

  /demo/simulate:
    post:
      operationId: demoSimulate
      tags: [Demo]
      summary: Simulate demo scenario
      description: |
        Applies a scenario mutation to the demo dataset.
        Only works for demo accounts (`is_demo: true`).

        | Scenario | Effect |
        |---|---|
        | `refund_arrives` | Marks pending/overdue promise as kept; injects matching bank credit |
        | `refund_delayed` | Extends due_date and adds timeline event |
        | `fake_promise` | Injects a needs_review promise with prompt-injection flag |
        | `duplicate_charge` | Injects duplicate-charge promise, auto-dismisses after 2s |
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario:
                  $ref: "#/components/schemas/DemoScenario"
                promise_id:
                  type: string
                  format: uuid
                  description: Target promise; auto-selected if omitted.
                  example: "11111111-0004-0000-0000-000000000004"
            example:
              scenario: "refund_arrives"
              promise_id: "11111111-0004-0000-0000-000000000004"
      responses:
        "200":
          description: Simulation applied
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: "#/components/schemas/DemoSimulateResult"
                  error:
                    type: "null"
              example:
                data:
                  scenario: "refund_arrives"
                  affected_promise_id: "11111111-0004-0000-0000-000000000004"
                  description: "Zomato delivery credit of ₹149 marked as received; bank credit injected"
                  simulated_at: "2026-11-26T07:30:00Z"
                error: null
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: PROMISE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ════════════════════════════════════════════
  # HEALTH
  # ════════════════════════════════════════════

  /health:
    get:
      operationId: health
      tags: [Health]
      summary: Health check
      description: Liveness and readiness probe. No auth required.
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    $ref: "#/components/schemas/HealthStatus"
                  error:
                    type: "null"
              example:
                data:
                  status: "ok"
                  version: "1.0.0"
                  checks:
                    database: "ok"
                    llm: "ok"
                  uptime_seconds: 86400
                error: null

# ─────────────────────────────────────────────
# Tags
# ─────────────────────────────────────────────
tags:
  - name: Auth
    description: Session management and Google OAuth
  - name: Gmail
    description: Gmail connection and sync
  - name: Jobs
    description: Background job status polling
  - name: Promises
    description: Promise CRUD and listing
  - name: Credits
    description: Bank credit upload and listing
  - name: Verify
    description: Deterministic promise re-verification
  - name: Escalation
    description: Next-step calculation and LLM draft generation
  - name: Dossier
    description: PDF dossier generation and download
  - name: Dashboard
    description: Aggregated summary statistics
  - name: Merchant
    description: Merchant promise-keeping records
  - name: Demo
    description: Demo scenario simulation (demo accounts only)
  - name: Health
    description: Liveness and readiness checks
