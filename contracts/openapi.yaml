        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PromiseCategory"
        - name: merchant_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-10-01"
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-11-30"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
